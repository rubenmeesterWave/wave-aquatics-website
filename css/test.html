<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>

        /* Desktop navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 40px;
  background: #5a2ca0;
}

.nav-menu {
  display: flex;
  gap: 20px;
  list-style: none;
}

.nav-menu li {
  position: relative;
}

.nav-menu li a {
  color: white;
  text-decoration: none;
  padding: 10px 5px;
}

/* Dropdowns */
.dropdown-menu {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background: white;
  min-width: 200px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  flex-direction: column;
}

.dropdown:hover > .dropdown-menu {
  display: flex;
}
/* Hide nav menu, show hamburger */
.hamburger {
  display: none;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}

.hamburger span {
  width: 25px;
  height: 3px;
  background: white;
}

/* Mobile */
@media (max-width: 1024px) {
  .hamburger {
    display: flex;
  }

  .nav-menu {
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    right: 0;
    width: 250px;
    height: 100vh;
    background: #4a1f8c;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    padding-top: 60px;
  }

  .nav-menu.open {
    transform: translateX(0);
  }

  .nav-menu li {
    width: 100%;
  }

  /* Dropdowns in mobile: hidden by default */
  .dropdown-menu {
    display: none;
    flex-direction: column;
    background: #5a2ca0;
  }

  .dropdown.open > .dropdown-menu {
    display: flex;
  }

  .dropdown-arrow {
    margin-left: auto;
    transition: transform 0.3s ease;
  }

  .dropdown.open > .dropdown-toggle > .dropdown-arrow {
    transform: rotate(180deg);
  }
}


    </style>
    <nav class="navbar">
        <div class="navbar-logo">
          <a href="index.html"><img src="logo.png" alt="Logo"></a>
        </div>
      
        <!-- Hamburger button -->
        <button class="hamburger" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
      
        <!-- Sidebar menu -->
        <ul class="nav-menu">
          <li><a href="index.html">Home</a></li>
      
          <li class="dropdown">
            <a href="#" class="dropdown-toggle">About
              <svg class="dropdown-arrow" width="16" height="16"><path d="M6 9l6 6 6-6"/></svg>
            </a>
            <ul class="dropdown-menu">
              <li><a href="mission.html">Our Mission</a></li>
              <li><a href="team.html">Meet the Team</a></li>
            </ul>
          </li>
      
          <li class="dropdown">
            <a href="#" class="dropdown-toggle">Programs
              <svg class="dropdown-arrow" width="16" height="16"><path d="M6 9l6 6 6-6"/></svg>
            </a>
            <ul class="dropdown-menu">
              <li><a href="lessons.html">Lessons</a></li>
              <li><a href="rentals.html">Pool Rentals</a></li>
            </ul>
          </li>
      
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <script>
        const hamburger = document.querySelector('.hamburger');
const navMenu = document.querySelector('.nav-menu');
const dropdownToggles = document.querySelectorAll('.dropdown-toggle');

hamburger.addEventListener('click', () => {
  navMenu.classList.toggle('open');
});

dropdownToggles.forEach(toggle => {
  toggle.addEventListener('click', (e) => {
    e.preventDefault();
    const parent = toggle.parentElement;
    parent.classList.toggle('open');
  });
});

      </script>
</body>
</html>
